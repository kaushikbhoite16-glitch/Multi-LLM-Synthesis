version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: multi_llm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: multi_llm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi_llm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/multi_llm
      - DEFAULT_EVALUATOR_MODEL=google/gemini-2.0-flash-001
      - DEFAULT_SYNTHESIS_MODEL=anthropic/claude-3.5-sonnet
      - MAX_COST_PER_QUERY=0.50
      - MAX_TOKENS_PER_QUERY=16000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi_llm_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
